- name: create user
  hosts: web
  become: yes
  tasks:
  - name: check user is existing or not
    ansible.builtin.command: id expense
    register: USER
    ignore_errors: true

  - name: print the user information
    ansible.builtin.debug:
      msg: user info {{ USER }}
  
  - name: create a user
    ansible.builtin.command: useradd expense
    when: USER.rc != 0
    
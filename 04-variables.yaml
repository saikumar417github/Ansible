- name: variables to print
  hosts: web
  vars:
    COURSE: "DevOps with AWS"
    PLATFORM: "online"
  tasks:
  - name: print the information
    ansible.builtin.debug:
      msg: "Hi, I am leaning {{COURSE}} course, platform is {{PLATFORM}}"
  - name: print the information again
    vars:
      COURSE: "DevOps"
    ansible.builtin.debug:
      msg: "Hi, I am leaning {{COURSE}} course, platform is {{PLATFORM}}"